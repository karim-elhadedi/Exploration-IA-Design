<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Agent — Design for IA</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sb-top">
        <div class="brand">AgentIA</div>
        <button id="newBtn" class="icon-btn">＋</button>
      </div>

      <nav class="sb-nav">
        <button class="sb-item active" data-action="new">Nouvelle discussion</button>
        <button class="sb-item" data-action="search">Rechercher</button>
        <button class="sb-item" data-action="library">Bibliothèque</button>
      </nav>

      <div class="sb-section">
        <div class="section-title">Récents</div>
        <ul id="recentList" class="recent-list"></ul>
      </div>

      <div class="sb-footer">
        <div class="profile">
          <div class="avatar">K</div>
          <div class="profile-info">
            <div class="name">Karim EL HADEDI</div>
            <div class="meta">Pro · Royaume‑Uni</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="hero">
        <h1 id="greeting">Salut Karim, on fait quoi ?</h1>

        <div class="command">
          <button id="plus" class="plus">＋</button>
          <input id="prompt" class="prompt" placeholder="Demander à l'agent (ex: créer une landing page depuis mon design system)" />
          <div class="controls">
            <select id="mode" class="mode"><option>Flash</option><option>Balanced</option><option>Thorough</option></select>
            <button id="mic" class="icon-btn">🎤</button>
          </div>
        </div>

        <div class="cta-row">
          <button id="analyzeBtn" class="cta">Analyser mon design system</button>
          <button id="generateBtn" class="cta ghost">Générer une page</button>
        </div>
      </div>

      <div id="results" class="results hidden">
        <!-- concise results rendered here -->
      </div>
    </main>

    <!-- Slide-over / panel right -->
    <div id="panel" class="panel hidden" aria-hidden="true">
      <header class="panel-header">
        <h3 id="panelTitle">Tokens</h3>
        <button id="closePanel" class="icon-btn">✕</button>
      </header>
      <div id="panelBody" class="panel-body">
        <!-- tokens / components / handoff content -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
